apiVersion: apps/v1
kind: Deployment
metadata:
  name: m013-duration-3h-deadline-6h
  namespace: default
  labels:
    app: m013-duration-3h-deadline-6h
    duration: duration-3h
    deadline: deadline-6h
spec:
  replicas: 1
  selector:
    matchLabels:
      name: m013
  template:
    metadata:
      labels:
        name: m013
    spec:
      schedulerName: fogatlas
      containers:
      - name: fake-container
        image: fake-image
        resources:
          requests:
            memory: 1Gi
            cpu: 100m
---
