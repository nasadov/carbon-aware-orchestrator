apiVersion: apps/v1
kind: Deployment
metadata:
  name: m107-duration-6h-deadline-12h
  namespace: default
  labels:
    app: m107-duration-6h-deadline-12h
    duration: duration-6h
    deadline: deadline-12h
spec:
  replicas: 1
  selector:
    matchLabels:
      name: m107
  template:
    metadata:
      labels:
        name: m107
    spec:
      schedulerName: fogatlas
      containers:
      - name: fake-container
        image: fake-image
        resources:
          requests:
            memory: 128Mi
            cpu: 250m
---
