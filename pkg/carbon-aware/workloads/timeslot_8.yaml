apiVersion: apps/v1
kind: Deployment
metadata:
  name: m091-duration-3h-deadline-6h
  namespace: default
  labels:
    app: m091-duration-3h-deadline-6h
    duration: duration-3h
    deadline: deadline-6h
spec:
  replicas: 1
  selector:
    matchLabels:
      name: m091
  template:
    metadata:
      labels:
        name: m091
    spec:
      schedulerName: fogatlas
      containers:
      - name: fake-container
        image: fake-image
        resources:
          requests:
            memory: 256Mi
            cpu: 250m
---
