apiVersion: apps/v1
kind: Deployment
metadata:
  name: one-duration-1h-deadline-7h
  namespace: default
  labels:
    app: one-duration-1h-deadline-7h
    duration: duration-1h
    deadline: deadline-7h
spec:
  replicas: 1
  selector:
    matchLabels:
      name: one
  template:
    metadata:
      labels:
        name: one
    spec:
      schedulerName: fogatlas
      containers:
      - name: fake-container
        image: fake-image
        resources:
          requests:
            memory: 1Gi
            cpu: 1000m
---
