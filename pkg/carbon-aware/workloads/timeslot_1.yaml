apiVersion: apps/v1
kind: Deployment
metadata:
  name: m019-duration-3h-deadline-27h
  namespace: default
  labels:
    app: m019
    duration: duration-3h
    deadline: deadline-27h
spec:
  replicas: 1
  selector:
    matchLabels:
      name: m019
  template:
    metadata:
      labels:
        name: m019
    spec:
      schedulerName: fogatlas
      containers:
      - name: fake-container
        image: fake-image
        resources:
          requests:
            memory: 128Mi
            cpu: 250m
---
