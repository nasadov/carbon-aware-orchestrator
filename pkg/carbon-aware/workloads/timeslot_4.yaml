apiVersion: apps/v1
kind: Deployment
metadata:
  name: m046-duration-3h-deadline-6h
  namespace: default
  labels:
    app: m046-duration-3h-deadline-6h
    duration: duration-3h
    deadline: deadline-6h
spec:
  replicas: 1
  selector:
    matchLabels:
      name: m046
  template:
    metadata:
      labels:
        name: m046
    spec:
      schedulerName: fogatlas
      containers:
      - name: fake-container
        image: fake-image
        resources:
          requests:
            memory: 128Mi
            cpu: 250m
---
