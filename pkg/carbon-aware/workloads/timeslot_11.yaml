apiVersion: apps/v1
kind: Deployment
metadata:
  name: m125-duration-6h-deadline-12h
  namespace: default
  labels:
    app: m125-duration-6h-deadline-12h
    duration: duration-6h
    deadline: deadline-12h
spec:
  replicas: 1
  selector:
    matchLabels:
      name: m125
  template:
    metadata:
      labels:
        name: m125
    spec:
      schedulerName: fogatlas
      containers:
      - name: fake-container
        image: fake-image
        resources:
          requests:
            memory: 2Gi
            cpu: 2000m
---
