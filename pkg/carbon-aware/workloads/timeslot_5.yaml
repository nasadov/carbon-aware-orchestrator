apiVersion: apps/v1
kind: Deployment
metadata:
  name: m079-duration-3h-deadline-9h
  namespace: default
  labels:
    app: m079-duration-3h-deadline-9h
    duration: duration-3h
    deadline: deadline-9h
spec:
  replicas: 1
  selector:
    matchLabels:
      name: m079
  template:
    metadata:
      labels:
        name: m079
    spec:
      schedulerName: fogatlas
      containers:
      - name: fake-container
        image: fake-image
        resources:
          requests:
            memory: 512Mi
            cpu: 100m
---
