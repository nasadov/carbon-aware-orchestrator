apiVersion: apps/v1
kind: Deployment
metadata:
  name: m024-duration-1h-deadline-4h
  namespace: default
  labels:
    app: m024-duration-1h-deadline-4h
    duration: duration-1h
    deadline: deadline-4h
spec:
  replicas: 1
  selector:
    matchLabels:
      name: m024
  template:
    metadata:
      labels:
        name: m024
    spec:
      schedulerName: fogatlas
      containers:
      - name: fake-container
        image: fake-image
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
---
