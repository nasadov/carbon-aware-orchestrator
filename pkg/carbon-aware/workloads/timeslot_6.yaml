apiVersion: apps/v1
kind: Deployment
metadata:
  name: m070-duration-3h-deadline-9h
  namespace: default
  labels:
    app: m070-duration-3h-deadline-9h
    duration: duration-3h
    deadline: deadline-9h
spec:
  replicas: 1
  selector:
    matchLabels:
      name: m070
  template:
    metadata:
      labels:
        name: m070
    spec:
      schedulerName: fogatlas
      containers:
      - name: fake-container
        image: fake-image
        resources:
          requests:
            memory: 128Mi
            cpu: 2000m
---
