apiVersion: apps/v1
kind: Deployment
metadata:
  name: m152-duration-6h-deadline-30h
  namespace: default
  labels:
    app: m152
    duration: duration-6h
    deadline: deadline-30h
spec:
  replicas: 1
  selector:
    matchLabels:
      name: m152
  template:
    metadata:
      labels:
        name: m152
    spec:
      schedulerName: fogatlas
      containers:
      - name: fake-container
        image: fake-image
        resources:
          requests:
            memory: 256Mi
            cpu: 1000m
---
