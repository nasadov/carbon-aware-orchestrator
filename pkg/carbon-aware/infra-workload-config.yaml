workload:
  # Directory to output workload files
  output_dir: workloads
  
  # Number of timeslots to generate
  num_timeslots: 24
  
  # Lambda parameter for Poisson distribution (average services per timeslot)
  poisson_lambda: 16
  
  # Minimum number of services per timeslot, regardless of Poisson distribution
  min_services: 1
  
  # Base name for microservices
  base_name: m
  
  # Available duration labels for pods
  durations:
    - 1  # short duration (1 hour)
    - 3  # medium duration (3 hours) 
    - 6  # long duration (6 hours)
  
  # How to assign durations (cycle through the values or pick randomly)
  duration_assignment_method: cycle  # "cycle" or "random"
  
  # NEW: Deadline configuration options
  # Strategy for determining deadlines: "tight", "flexible", "mixed", or "exact"
  deadline_strategy: flexible
  
  # NEW: Hours to add to duration for flexible deadlines
  deadline_flexibility_hours:
    - 2   # Low flexibility: duration + 2h
    - 6   # Medium flexibility: duration + 6h
    - 24  # High flexibility: duration + 24h
  
  # Available CPU request options
  cpu_options:
    - 1000m  # 1 full core
    - 500m   # half core
    - 250m   # quarter core
    - 100m   # tenth of a core
  
  # Available memory request options
  mem_options:
    - 1Gi
    - 512Mi
    - 256Mi
    - 128Mi
  
  # Random seed for reproducibility
  random_seed: 42