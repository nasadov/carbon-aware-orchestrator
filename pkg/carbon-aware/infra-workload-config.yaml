# Configuration for infrastructure and workload generation

nodes:
  # Filename for the generated nodes
  filename: nodes.yaml
  
  # Number of nodes to generate
  num_nodes: 8
  
  # Base name for nodes
  base_node_name: kwok-node-0
  
  # Regions to assign to nodes (should match carbon intensity forecast regions)
  regions: 
    - DE
    - FR
    - ES
    - IT-NO
  
  # Method to assign regions to nodes ("cycle" or "random")
  assignment_method: cycle
  
  # Hardware subcategories configuration
  hardware_subcategories:
    IoT:
      cpu: "2"
      memory: "2Gi"
      embodied_carbon: 27.471
      lifetime: 5.2
      power:
        idle: 0.5    # Watts
        active: 2.0  # Watts
        max: 5.0     # Watts
    Smartphone:
      cpu: "4"
      memory: "4Gi"
      embodied_carbon: 52.729
      lifetime: 3.03
      power:
        idle: 1.0    # Watts
        active: 3.0  # Watts
        max: 15.0    # Watts
    Laptop:
      cpu: "8"
      memory: "16Gi"
      embodied_carbon: 231.855
      lifetime: 4.13
      power:
        idle: 10.0   # Watts
        active: 40.0 # Watts
        max: 150.0   # Watts
    Server:
      cpu: "32"
      memory: "64Gi"
      embodied_carbon: 1230.656
      lifetime: 3.87
      power:
        idle: 100.0  # Watts
        active: 200.0# Watts
        max: 400.0   # Watts
  
  # Method to assign hardware types to nodes
  # "cycle" - cycle through hardware types in order
  # "random" - randomly assign hardware types
  # "shifted_cycle" - cycle through but with an offset to avoid same region-hardware mapping
  hardware_assignment_method: shifted_cycle
  
  # Offset to use when doing shifted_cycle assignment (default: 1)
  # This determines how many positions to shift the hardware cycle for each new cycle
  hardware_cycle_offset: 1
  
  # Random seed for reproducibility
  random_seed: 42

workload:
  # Directory to output workload files
  output_dir: workloads
  
  # Number of timeslots to generate
  num_timeslots: 12
  
  # Lambda parameter for Poisson distribution (average services per timeslot)
  poisson_lambda: 4
  
  # Minimum number of services per timeslot, regardless of Poisson distribution
  min_services: 1
  
  # Base name for microservices
  base_name: m
  
  # Available duration labels for pods
  durations:
    - 1  # short duration (1 hour)
    - 3  # medium duration (3 hours) 
    - 6  # long duration (6 hours)
  
  # How to assign durations (cycle through the values or pick randomly)
  duration_assignment_method: cycle  # "cycle" or "random"
  
  # Deadline configuration options
  # Strategy for determining deadlines: "tight", "flexible", "mixed", or "exact"
  deadline_strategy: flexible
  
  # Hours to add to duration for flexible deadlines
  deadline_flexibility_hours:
    - 1   # Low flexibility: duration + 1h
    - 3   # Medium flexibility: duration + 3h
    - 6   # High flexibility: duration + 6h
  
  # Available CPU request options
  cpu_options:
    - 1000m  # 1 full core
    - 500m   # half core
    - 250m   # quarter core
    - 100m   # tenth of a core
  
  # Available memory request options
  mem_options:
    - 1Gi
    - 512Mi
    - 256Mi
    - 128Mi
  
  # Random seed for reproducibility
  random_seed: 42