optimization:
  use_lexicographic: true
  unplaced_penalty: 4000
  emissions:
    dynamic_weight: 1.0
    activation_weight: 1.0
    fallback_surrogate_activation_weight: 0.0
  pruning:
    enable: false
    top_k_per_pod: 6
    emissions_margin: 0.35
  constraints:
    max_unplaced_fraction: 0.1
  solver:
    name: cp_sat
    time_limit: 900
    gap_tolerance: 0.05
    threads: 8
nodes:
  filename: nodes.yaml
  regions:
    region_counts:
      FR: 1
      ES: 1
      IT-NO: 1
      DE: 1
  assignment_method: exact_counts
  explicit_assignments:
    FR:
      IoT: 1
    ES:
      Smartphone: 1
    IT-NO:
      Laptop: 1
    DE:
      Server: 1
  hardware_assignment:
    hardware_counts:
      IoT: 1
      Smartphone: 1
      Laptop: 1
      Server: 1
  hardware_assignment_method: exact_counts
  hardware_subcategories:
    IoT:
      cpu: '2'
      memory: 2Gi
      embodied_carbon: 27.471
      lifetime: 5.2
      power:
        idle: 0.5
        active: 2.0
        max: 5.0
    Smartphone:
      cpu: '4'
      memory: 4Gi
      embodied_carbon: 52.729
      lifetime: 3.03
      power:
        idle: 1.0
        active: 3.0
        max: 15.0
    Laptop:
      cpu: '8'
      memory: 8Gi
      embodied_carbon: 231.855
      lifetime: 4.13
      power:
        idle: 10.0
        active: 40.0
        max: 150.0
    Server:
      cpu: '16'
      memory: 16Gi
      embodied_carbon: 1230.656
      lifetime: 3.87
      power:
        idle: 100.0
        active: 200.0
        max: 400.0
  random_seed: 44
water:
  enabled: true
  data_sources:
    aware_country_factors_csv: data/water/aware20_country_nonagri_factors.csv
    grid_water_factors_csv: data/water/wri_country_grid_water_factors.csv
    wue_region_slot_csv: data/water/open_meteo_region_wue_by_slot.csv
    embodied_water_reference_csv: data/water/embodied_water_reference.csv
  defaults:
    pue: 1.2
    embodied_water: 0.0
    wue: 0.0
    ewif: 0.0
    direct_scarcity_cf: 1.0
    indirect_scarcity_cf: 1.0
    embodied_scarcity_cf: 1.0
    criticality: 1.0
  region_to_country:
    FR: FR
    ES: ES
    IT-NO: IT
    DE: DE
  by_region:
    FR:
      pue: 1.18
      wue: 0.18
      criticality: 1.05
      weather_reference:
        name: Paris
        latitude: 48.8566
        longitude: 2.3522
    ES:
      pue: 1.24
      wue: 0.32
      criticality: 1.35
      weather_reference:
        name: Madrid
        latitude: 40.4168
        longitude: -3.7038
    IT-NO:
      pue: 1.21
      wue: 0.24
      criticality: 1.18
      weather_reference:
        name: Milan
        latitude: 45.4642
        longitude: 9.1900
    DE:
      pue: 1.16
      wue: 0.12
      criticality: 1.02
      weather_reference:
        name: Frankfurt
        latitude: 50.1109
        longitude: 8.6821
  by_country:
    FR: {}
    ES: {}
    IT: {}
    DE: {}
  by_hardware_subcategory: {}
workload:
  output_dir: workloads
  vanilla_output_dir: workloads-vanilla
  num_timeslots: 12
  generation_strategy: exact_total
  poisson_lambda: 4
  exact_total_pods: 200
  min_services: 1
  base_name: m
  durations:
  - 1
  - 3
  - 6
  duration_assignment_method: cycle
  deadline_strategy: flexible
  deadline_flexibility_hours:
  - 1
  - 3
  - 6
  cpu_options:
  - 2000m
  - 1000m
  - 500m
  - 250m
  - 100m
  mem_options:
  - 2Gi
  - 1Gi
  - 512Mi
  - 256Mi
  - 128Mi
  random_seed: 44
