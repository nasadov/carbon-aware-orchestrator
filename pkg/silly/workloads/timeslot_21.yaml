apiVersion: apps/v1
kind: Deployment
metadata:
  name: m298-duration-3h-deadline-9h
  namespace: default
  labels:
    app: m298
    duration: duration-3h
    deadline: deadline-9h
  annotations:
    scheduling.carbon/duration_hours: '3'
    scheduling.carbon/deadline_hours: '9'
spec:
  replicas: 1
  selector:
    matchLabels:
      name: m298
  template:
    metadata:
      labels:
        name: m298
      annotations:
        scheduling.carbon/duration_hours: '3'
        scheduling.carbon/deadline_hours: '9'
    spec:
      schedulerName: fogatlas
      containers:
      - name: fake-container
        image: fake-image
        resources:
          requests:
            memory: 512Mi
            cpu: 100m
---
