apiVersion: apps/v1
kind: Deployment
metadata:
  name: m266-duration-6h-deadline-30h
  namespace: default
  labels:
    app: m266
    duration: duration-6h
    deadline: deadline-30h
  annotations:
    scheduling.carbon/duration_hours: '6'
    scheduling.carbon/deadline_hours: '30'
spec:
  replicas: 1
  selector:
    matchLabels:
      name: m266
  template:
    metadata:
      labels:
        name: m266
      annotations:
        scheduling.carbon/duration_hours: '6'
        scheduling.carbon/deadline_hours: '30'
    spec:
      schedulerName: fogatlas
      containers:
      - name: fake-container
        image: fake-image
        resources:
          requests:
            memory: 256Mi
            cpu: 500m
---
