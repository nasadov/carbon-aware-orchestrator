apiVersion: apps/v1
kind: Deployment
metadata:
  name: m000
  namespace: default
  labels:
    app: m000
    duration: duration3
spec:
  replicas: 1
  selector:
    matchLabels:
      name: m000
  template:
    metadata:
      labels:
        name: m000
    spec:
      schedulerName: fogatlas
      containers:
      - name: fake-container
        image: fake-image
        resources:
          requests:
            memory: 1Gi
            cpu: 1000m
---
