apiVersion: apps/v1
kind: Deployment
metadata:
  name: m067
  namespace: default
  labels:
    app: m067
    duration: duration3
spec:
  replicas: 1
  selector:
    matchLabels:
      name: m067
  template:
    metadata:
      labels:
        name: m067
    spec:
      schedulerName: fogatlas
      containers:
      - name: fake-container
        image: fake-image
        resources:
          requests:
            memory: 1Gi
            cpu: 1000m
---
