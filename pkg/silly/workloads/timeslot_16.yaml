apiVersion: apps/v1
kind: Deployment
metadata:
  name: m239-duration-6h-deadline-8h
  namespace: default
  labels:
    app: m239
    duration: duration-6h
    deadline: deadline-8h
spec:
  replicas: 1
  selector:
    matchLabels:
      name: m239
  template:
    metadata:
      labels:
        name: m239
    spec:
      schedulerName: fogatlas
      containers:
      - name: fake-container
        image: fake-image
        resources:
          requests:
            memory: 256Mi
            cpu: 500m
