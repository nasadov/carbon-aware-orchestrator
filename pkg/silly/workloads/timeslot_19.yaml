apiVersion: apps/v1
kind: Deployment
metadata:
  name: m282-duration-1h-deadline-7h
  namespace: default
  labels:
    app: m282
    duration: duration-1h
    deadline: deadline-7h
  annotations:
    scheduling.carbon/duration_hours: '1'
    scheduling.carbon/deadline_hours: '7'
spec:
  replicas: 1
  selector:
    matchLabels:
      name: m282
  template:
    metadata:
      labels:
        name: m282
      annotations:
        scheduling.carbon/duration_hours: '1'
        scheduling.carbon/deadline_hours: '7'
    spec:
      schedulerName: fogatlas
      containers:
      - name: fake-container
        image: fake-image
        resources:
          requests:
            memory: 1Gi
            cpu: 100m
---
