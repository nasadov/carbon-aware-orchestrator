apiVersion: apps/v1
kind: Deployment
metadata:
  name: m313-duration-3h-deadline-27h
  namespace: default
  labels:
    app: m313
    duration: duration-3h
    deadline: deadline-27h
  annotations:
    scheduling.carbon/duration_hours: '3'
    scheduling.carbon/deadline_hours: '27'
spec:
  replicas: 1
  selector:
    matchLabels:
      name: m313
  template:
    metadata:
      labels:
        name: m313
      annotations:
        scheduling.carbon/duration_hours: '3'
        scheduling.carbon/deadline_hours: '27'
    spec:
      schedulerName: fogatlas
      containers:
      - name: fake-container
        image: fake-image
        resources:
          requests:
            memory: 128Mi
            cpu: 500m
